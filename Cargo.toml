[package]
name = "builder"
version = "0.1.0"
edition = "2024"
description = "A terminal coding agent for OpenAI-compatible model servers."
license = "MIT"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
builder-core = { path = "crates/builder-core" }
builder-provider = { path = "crates/builder-provider" }
builder-tools = { path = "crates/builder-tools" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
indicatif = "0.18"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

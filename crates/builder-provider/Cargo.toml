[package]
name = "builder-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[dependencies]
builder-core = { path = "../builder-core" }
anyhow = "1"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync"] }
fastembed = { version = "=6.0.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

tempfile = "3"

[package]
name = "builder-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "6"
fs2 = "0.4"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
serde_yaml_ng = "0.10"
json5 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

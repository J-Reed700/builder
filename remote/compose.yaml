# Default project name; `docker compose -p` still overrides it (the smoke test does).
name: builder-remote

services:
  builder-web:
    build: .
    image: builder-remote:local
    restart: unless-stopped
    ports:
      - "${BUILDER_WEB_BIND:-127.0.0.1}:${BUILDER_WEB_PORT:-8080}:8080"
    environment:
      BUILDER_UPSTREAM: ${BUILDER_UPSTREAM:-host.docker.internal:7432}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    # Only static assets and HTTP proxying; no host filesystem or Docker socket mounts.
